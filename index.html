.tap-hint { margin: 12px 2px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--faint); font-size: 11px; }
.rating-wrap { margin-top: 17px; }
.rating-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
.rating-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate-btn { min-height: 60px; padding: 8px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.rate-btn b { font-size: 13px; white-space: nowrap; }
.rate-btn small { color: var(--muted); font-size: 10px; }
.rate-btn:hover { transform: translateY(-1px); border-color: var(--line-strong); }
.rate-0 { border-left: 4px solid var(--red); }
.rate-1 { border-left: 4px solid var(--amber); }
.rate-2 { border-left: 4px solid var(--green); }
.rate-3 { border-left: 4px solid #285c3f; }
.rate-0:hover { background: var(--red-soft); }
.rate-1:hover { background: var(--amber-soft); }
.rate-2:hover, .rate-3:hover { background: var(--green-soft); }
.finish-box { padding: 42px 22px; text-align: center; }
.finish-mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-size: 25px; }
.finish-box h3 { margin: 0 0 5px; font-family: var(--serif); font-size: 24px; }
.finish-box p { margin: 0 auto 16px; max-width: 520px; color: var(--muted); font-size: 13px; }

/* filters */
.filter-panel { padding: 15px 16px; margin-bottom: 16px; }
.filter-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
.field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 600; }
.field select, .field input[type="text"], .field input[type="search"], .field input[type="number"], .field textarea { width: 100%; min-height: 46px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 14px; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.field select:focus, .field input:focus, .field textarea:focus { border-color: var(--blue); outline: 3px solid rgba(46,93,103,.15); }
.switch { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.filter-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.filter-summary { color: var(--faint); font-size: 11px; }
.manage-toolbar { padding: 14px 15px; margin-bottom: 16px; }
.manage-toolbar .filter-row { grid-template-columns: minmax(180px, 1.5fr) repeat(3, minmax(0, .8fr)); }
.manage-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
.manage-count { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
.manage-list { display: grid; gap: 9px; }
.manage-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; }
.manage-row:hover { border-color: var(--line-strong); }
.manage-row.archived { opacity: .66; background: var(--surface-2); }
.manage-main { min-width: 0; }
.manage-topline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
.manage-word { margin: 0 0 2px; font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.manage-word span { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 7px; }
.manage-a { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.manage-meta { margin-top: 5px; color: var(--faint); font-size: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.row-actions { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.row-actions .btn { min-height: 44px; padding: 7px 9px; font-size: 12px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 16px; }
.pager-info { min-width: 100px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.details-panel { margin-bottom: 16px; overflow: hidden; }
.details-panel summary { min-height: 52px; padding: 13px 17px; display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; color: var(--ink-2); list-style: none; }
.details-panel summary::-webkit-details-marker { display: none; }
.details-panel summary::after { content: "＋"; margin-left: auto; color: var(--muted); font-weight: 400; }
.details-panel[open] summary::after { content: "－"; }
.details-body { padding: 15px 17px 17px; border-top: 1px solid var(--line); }
.import-help { margin: 0 0 9px; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 11px; line-height: 1.7; }
.import-help code { color: var(--accent-dark); }
.bulk-preview { margin-top: 12px; }
.preview-list { display: grid; gap: 7px; max-height: 300px; overflow: auto; margin: 8px 0 11px; }
.preview-item { padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.preview-item .preview-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
.preview-item p { margin: 0; font-size: 12px; color: var(--ink-2); }
.preview-item .preview-a { color: var(--muted); }
.import-errors { color: var(--red); font-size: 12px; margin: 6px 0 0; }
.danger-zone { border-color: #e4c4bf; }
html[data-theme="dark"] .danger-zone { border-color: #623b37; }
.danger-zone .section-title { color: var(--red); }

/* stats */
.stats-summary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
.summary-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.summary-label { color: var(--muted); font-size: 11px; }
.summary-value { margin-top: 3px; font-family: var(--serif); font-size: 25px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.summary-value.accent { color: var(--accent); }
.summary-value.gold { color: var(--gold); }
.summary-value.weak { color: var(--red); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-box { position: relative; height: 290px; padding: 12px; }
.chart-fallback { display: grid; gap: 10px; padding: 16px; }
.fallback-row { display: grid; grid-template-columns: 85px 1fr 40px; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); }
.fallback-row .bar { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.fallback-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.stats-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.calendar-title { margin: 0; font-family: var(--serif); font-size: 19px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.calendar-weekday { text-align: center; color: var(--faint); font-size: 10px; padding: 4px 0; }
.cal-day { min-height: 48px; border-radius: 8px; background: var(--surface-2); border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-day.today { border-color: var(--accent); color: var(--accent-dark); }
.cal-day .cal-count { font-size: 9px; color: var(--faint); }
.cal-day[data-level="1"] { background: #e7efe8; }
.cal-day[data-level="2"] { background: #d2e3d6; }
.cal-day[data-level="3"] { background: #b5d1bc; color: #203427; }
html[data-theme="dark"] .cal-day[data-level="1"] { background: #21342a; }
html[data-theme="dark"] .cal-day[data-level="2"] { background: #2a4536; }
html[data-theme="dark"] .cal-day[data-level="3"] { background: #396049; color: #eff8f1; }
.calendar-legend { display: flex; align-items: center; gap: 8px; margin-top: 11px; color: var(--faint); font-size: 10px; }
.calendar-legend .box { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }
.calendar-legend .box.l1 { background: #e7efe8; }
.calendar-legend .box.l2 { background: #d2e3d6; }
.calendar-legend .box.l3 { background: #b5d1bc; }
html[data-theme="dark"] .calendar-legend .box.l1 { background: #21342a; }
html[data-theme="dark"] .calendar-legend .box.l2 { background: #2a4536; }
html[data-theme="dark"] .calendar-legend .box.l3 { background: #396049; }
.chapter-stats { display: grid; gap: 10px; }
.chapter-stat-row { display: grid; grid-template-columns: 90px 1fr 100px; gap: 10px; align-items: center; }
.chapter-stat-name { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.stack-bar { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
.stack-bar i { display: block; height: 100%; }
.stack-mastered { background: var(--green); }
.stack-due { background: var(--amber); }
.stack-weak { background: var(--red); }
.chapter-stat-nums { display: flex; gap: 7px; justify-content: flex-end; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 13px; color: var(--muted); font-size: 11px; margin: 2px 0 12px; }
.legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.tips-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.tips-list li { display: flex; gap: 9px; font-size: 12px; color: var(--muted); line-height: 1.55; }
.tips-num { flex: 0 0 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-dark); font-size: 10px; font-weight: 700; }

/* modal / toast */
body.modal-open { overflow: hidden; }
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20,18,14,.52); backdrop-filter: blur(3px); }
.modal-panel { position: relative; z-index: 1; width: min(620px, 100%); max-height: min(88vh, 860px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-strong); animation: modal-in .14s ease-out; }
.modal-panel.wide { width: min(900px, 100%); }
@keyframes modal-in { from { opacity: .4; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.modal-title { margin: 0; font-family: var(--serif); font-size: 20px; }
.modal-close { margin-left: auto; width: 44px; height: 44px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
.modal-close:hover { background: var(--surface-2); color: var(--ink); }
.modal-body { padding: 18px; }
.modal-body p { color: var(--ink-2); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
.modal-note { color: var(--muted); font-size: 12px; line-height: 1.6; }
.modal-form { display: grid; gap: 12px; }
.modal-form .field-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.modal-form .field-row.two { grid-template-columns: 1fr 1fr; }
.danger-confirm { padding: 12px 14px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-weight: 600; font-size: 13px; }
.type-tip { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 10px; color: var(--ink-2); font-size: 13px; line-height: 1.65; }
.type-tip i { color: var(--amber); font-size: 18px; margin-top: 2px; }
.timer-display { margin: 14px 0 12px; font-family: var(--serif); font-size: clamp(36px, 8vw, 48px); line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.timer-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.timer-actions .btn { flex: 1; min-width: 76px; }
.timer-state { margin: 10px 0 0; color: var(--faint); font-size: 11px; }
.speech-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.speech-preview { min-height: 48px; display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-family: var(--serif); font-size: 22px; }
.text-output { width: 100%; min-height: 380px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-family: var(--sans); font-size: 12px; line-height: 1.65; }
.toast-root { position: fixed; left: 50%; bottom: 22px; z-index: 120; transform: translateX(-50%); display: grid; gap: 7px; width: max-content; max-width: calc(100% - 32px); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 9px 14px; background: var(--ink); color: var(--surface); border-radius: 11px; box-shadow: var(--shadow-strong); font-size: 13px; animation: toast-in .16s ease-out; }
.toast.success { background: var(--green); color: #f5fff8; }
.toast.warn { background: var(--amber); color: #fffaf0; }
.toast.error { background: var(--red); color: #fff8f6; }
.toast i { font-size: 13px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.help-block { display: grid; gap: 10px; }
.help-block h3 { margin: 10px 0 0; font-family: var(--serif); font-size: 17px; }
.help-block p, .help-block li { color: var(--ink-2); font-size: 13px; line-height: 1.7; }
.help-block ol { margin: 0; padding-left: 22px; }
.help-block code { background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }
.help-callout { padding: 11px 13px; border-radius: 10px; background: var(--amber-soft); border-left: 3px solid var(--amber); color: var(--ink-2); font-size: 12px; line-height: 1.65; }
.app-footer { padding: 0 0 28px; color: var(--faint); font-size: 11px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.app-footer button { min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }

/* responsive */
@media (max-width: 1100px) {
  .chapter-layout { grid-template-columns: 1fr; }
  .chapter-side { position: static; grid-template-columns: 1fr 1fr; }
  .stats-summary { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .app-shell { width: min(100% - 24px, 1240px); }
  .chapter-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .chapter-tab .ct-title { font-size: 13px; }
  .filter-row { grid-template-columns: 1fr 1fr; }
  .stats-grid, .stats-bottom { grid-template-columns: 1fr; }
  .manage-toolbar .filter-row { grid-template-columns: minmax(180px, 1.5fr) repeat(2, minmax(0, .8fr)); }
}
@media (max-width: 760px) {
  .topbar-inner { min-height: 68px; gap: 10px; }
  .brand-mark { width: 42px; height: 42px; flex-basis: 42px; font-size: 13px; }
  .brand-sub { display: none; }
  .brand-title { font-size: 18px; }
  .main-nav { top: 68px; }
  .nav-btn { min-width: 88px; min-height: 50px; padding: 5px 9px; font-size: 12px; gap: 6px; }
  .nav-btn i { font-size: 13px; }
  .mode { padding-top: 17px; }
  .head-seal { width: 58px; height: 58px; font-size: 17px; }
  .mode-desc { font-size: 12px; }
  .round-banner { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px; }
  .chapter-grid { grid-template-columns: repeat(5, 160px); overflow-x: auto; padding-bottom: 4px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .chapter-side { grid-template-columns: 1fr; }
  .word-card { min-height: 380px; padding: 18px 15px 16px; }
  .word-text { font-size: clamp(42px, 10vw, 64px); }
  .word-text.phrase { font-size: clamp(32px, 8vw, 52px); }
  .rating-grid { grid-template-columns: 1fr 1fr; }
  .rating-title span:last-child { display: none; }
  .study-body { padding: 12px; }
  .study-top { padding: 9px 12px; }
  .relation-grid { grid-template-columns: 1fr; }
  .stats-summary { grid-template-columns: 1fr 1fr; }
  .manage-toolbar .filter-row { grid-template-columns: 1fr 1fr; }
  .manage-toolbar .filter-row .field:first-child { grid-column: span 2; }
  .manage-row { grid-template-columns: 1fr; gap: 8px; }
  .row-actions { justify-content: flex-start; }
  .chapter-stat-row { grid-template-columns: 80px 1fr; }
  .chapter-stat-nums { grid-column: 1 / -1; justify-content: flex-start; }
  .modal-form .field-row { grid-template-columns: 1fr 1fr; }
  .cal-day { min-height: 42px; }
}
@media (max-width: 520px) {
  .app-shell { width: calc(100% - 18px); }
  .header-clock { display: none; }
  .font-control { display: none; }
  .brand-copy { overflow: hidden; }
  .brand-title { overflow: hidden; text-overflow: ellipsis; }
  .top-actions { gap: 5px; }
  .icon-btn { padding: 0 10px; }
  .mode-title { font-size: 25px; }
  .filter-row, .manage-toolbar .filter-row { grid-template-columns: 1fr; }
  .manage-toolbar .filter-row .field:first-child { grid-column: span 1; }
  .round-banner { grid-template-columns: 1fr; }
  .stats-summary { grid-template-columns: 1fr 1fr; }
  .modal { padding: 8px; }
  .modal-panel { max-height: 94vh; border-radius: 14px; }
  .modal-body { padding: 14px; }
  .modal-form .field-row { grid-template-columns: 1fr; }
  .calendar-grid { gap: 3px; }
  .cal-day { min-height: 38px; font-size: 11px; }
  .cal-day .cal-count { font-size: 8px; }
  .toast-root { bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
  </style>

<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner app-shell">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">698</div>
          <div class="brand-copy">
            <h1 class="brand-title">考研英语核心词 · 单词背诵</h1>

          <button class="icon-btn" type="button" data-action="open-help" title="使用说明与备份提醒" aria-label="使用说明">

          </button>
          <button class="icon-btn" type="button" data-action="toggle-theme" id="themeBtn" title="浅色 / 深色主题" aria-label="切换主题">
            <i class="fa-regular fa-moon" aria-hidden="true"></i>
          </button>
          <div class="font-control" title="释义字体缩放">
            <i class="fa-solid fa-font" aria-hidden="true"></i>
            <input type="range" id="fontScale" min="100" max="150" step="5" value="100" aria-label="字体缩放">
            <span class="font-value" id="fontValue">100%</span>
          </div>
        </div>
      </div>
    </header>

    <nav class="main-nav" aria-label="学习模式">
      <div class="app-shell">
        <div class="nav-scroll" id="mainNav">
          <button class="nav-btn active" type="button" data-mode="chapter" aria-controls="mode-chapter">
            <i class="fa-solid fa-book-open" aria-hidden="true"></i><span>章节</span>
          </button>
          <button class="nav-btn" type="button" data-mode="test" aria-controls="mode-test">
            <i class="fa-solid fa-pen-nib" aria-hidden="true"></i><span>默写</span>
          </button>
          <button class="nav-btn" type="button" data-mode="weak" aria-controls="mode-weak">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span>薄弱</span>
          </button>
          <button class="nav-btn" type="button" data-mode="manage" aria-controls="mode-manage">
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>词库</span>
          </button>
          <button class="nav-btn" type="button" data-mode="stats" aria-controls="mode-stats">
            <i class="fa-solid fa-chart-simple" aria-hidden="true"></i><span>统计</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="app-shell">

  function speakWord(text) {
    if (!speechSupported) {
      toast('当前浏览器不支持语音朗读，建议换 Safari / Chrome / Edge。', 'warn');
      return;
    }
    if (!text) return;
    try {
      loadVoices();
      lastSpokenWord = String(text).replace(/\s*\/\s*/g, ' ');
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(lastSpokenWord);
      u.lang = 'en-US';
      u.rate = clamp(Number(state.settings.speechRate) || 0.85, 0.5, 1.3);
      const v = pickVoice();
      if (v) u.voice = v;
      u.onerror = (event) => {
        if (event.error && event.error !== 'canceled' && event.error !== 'interrupted') {
          toast(`朗读失败：${event.error}`, 'warn');
        }
      };
      window.speechSynthesis.speak(u);
    } catch (e) {
      toast('朗读启动失败，请检查系统是否安装英文语音包。', 'error');
    }
  }
  if (speechSupported) {
    loadVoices();
    try {
      window.speechSynthesis.onvoiceschanged = () => {
        loadVoices();
        const sel = $('#voiceSelect');
        if (sel) sel.innerHTML = voiceSelectOptions();
      };
    } catch (e) { /* noop */ }
  }

  /* ============================================================
     复习算法 / 统计
     ============================================================ */
  function scheduleWord(word, rating) {
    const r = word.reviewInfo;
    const wasNew = !r.nextReviewTimeStamp;
    let continuous = Number(r.continuousCorrect) || 0;
    let days;
    if (rating === 0) {
      continuous = 0;
      days = 10 / 1440;
      word.isWeakCard = true;
    } else if (rating === 1) {
      days = 0.5 * Math.pow(1.5, Math.min(continuous, 3));
    } else if (rating === 2) {
      days = 1 * Math.pow(2, Math.min(continuous, 5));
      continuous += 1;
    } else {
      days = 2 * Math.pow(2.6, Math.min(continuous, 5));
      continuous += 1;
    }
    let ms = Math.round(days * 86400000);
    if (rating === 0) ms = 10 * 60 * 1000;
    else ms = clamp(ms, rating === 1 ? 6 * 3600 * 1000 : 24 * 3600 * 1000, 180 * 86400000);
    r.nextReviewTimeStamp = Date.now() + ms;
    r.continuousCorrect = continuous;
    r.lastSelfRate = rating;
    return { wasNew, ms };
  }
  function formatInterval(ms) {
    if (ms < 3600000) return `${Math.max(1, Math.round(ms / 60000))} 分钟后`;
    if (ms < 86400000) return `${Math.round(ms / 3600000)} 小时后`;
    return `${Math.round(ms / 86400000)} 天后`;
  }
  function recordReview(word, rating, wasNew) {
    const key = todayKey();
    const d = state.stats.daily[key] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0, 0, 0, 0] };
    d.reviewed = (Number(d.reviewed) || 0) + 1;
    if (wasNew) d.newLearned = (Number(d.newLearned) || 0) + 1;
    if (rating === 0) d.weakAdded = (Number(d.weakAdded) || 0) + 1;
    if (!Array.isArray(d.ratings)) d.ratings = [0, 0, 0, 0];
    d.ratings[rating] = (Number(d.ratings[rating]) || 0) + 1;
    state.stats.daily[key] = d;
  }
  function dueCount() { return activeWords().filter(isDue).length; }
  function highCount() { return state.words.filter(isHigh).length; }
  function masteredCount() {
    return activeWords().filter(w => Number(w.reviewInfo.continuousCorrect) >= 2 || w.reviewInfo.lastSelfRate === 3).length;
  }

  /* ============================================================
     队列
     ============================================================ */
  function sortByFreq(list) {
    return list.slice().sort((a, b) => {
      const df = Number(b.freq) - Number(a.freq);
      if (df) return df;
      return a.word.localeCompare(b.word, 'en');
    });
  }
  function scopeWords(scope) {
    const list = activeWords();
    if (scope === APPENDIX) return list.filter(isHigh);
    return list.filter(w => w.chapter === scope);
  }
  function chapterQueue(scope) {
    return sortByFreq(scopeWords(scope).filter(w => isNew(w) || isDue(w)));
  }
  function initChapterQueue(force = false) {
    if (force || !ui.chapter.initialized) {
      ui.chapter.queue = chapterQueue(state.settings.scope).map(w => w.id);
      ui.chapter.idx = 0; ui.chapter.revealed = false; ui.chapter.done = false; ui.chapter.skipped = 0; ui.chapter.initialized = true;
    }
  }
  function testQueue() {
    const f = state.settings;
    let list = activeWords();
    if (f.testChapter !== 'all') {
      list = f.testChapter === APPENDIX ? list.filter(isHigh) : list.filter(w => w.chapter === f.testChapter);
    }
    if (f.testHighOnly) list = list.filter(isHigh);
    return sortByFreq(list);
  }
  function initTestQueue(force = false) {
    if (force || !ui.test.initialized) {
      ui.test.queue = testQueue().map(w => w.id);
      ui.test.idx = 0; ui.test.revealed = false; ui.test.done = false; ui.test.skipped = 0; ui.test.initialized = true;
    }
  }
  function weakQueue() { return sortByFreq(activeWords().filter(w => w.isWeakCard)); }
  function initWeakQueue(force = false) {
    if (force || !ui.weak.initialized) {
      ui.weak.queue = weakQueue().map(w => w.id);
      ui.weak.idx = 0; ui.weak.revealed = false; ui.weak.done = false; ui.weak.skipped = 0; ui.weak.initialized = true;
    }
  }
  function currentWord(mode) {
    const s = ui[mode];
    if (!s || s.idx < 0 || s.idx >= s.queue.length) return null;
    return getWord(s.queue[s.idx]);
  }
  function advance(mode) {
    const s = ui[mode];
    s.idx += 1; s.revealed = false;
    if (s.idx >= s.queue.length) s.done = true;
    renderMode(mode);
  }

  function normalizeChapterInput(v) {
    const s = String(v || '').trim();
    if (!s) return null;
    for (const c of CHAPTERS) {
      if (s === c.id || s === c.short || s === c.name || s.includes(c.short) || s.includes(c.name)) return c.id;
    }
    if (/附录|高频/.test(s)) return CHAPTERS[3].id;
    return null;
  }
  function manageFiltered() {
    const f = state.settings.manageFilters;
    let list = state.words.slice();
    if (f.q) {
      const q = f.q.toLowerCase();
      list = list.filter(w => [w.word, w.pos, w.chinese, w.synonym, w.antonym, w.chapter].join(' ').toLowerCase().includes(q));
    }
    if (f.chapter !== 'all') list = list.filter(w => w.chapter === f.chapter);
    if (f.highOnly) list = list.filter(isHigh);
    if (f.status === 'active') list = list.filter(w => !w.isArchived);
    else if (f.status === 'weak') list = list.filter(w => w.isWeakCard);
    else if (f.status === 'archived') list = list.filter(w => w.isArchived);
    return list.sort((a, b) => {
      const ca = CHAPTER_IDS.indexOf(a.chapter), cb = CHAPTER_IDS.indexOf(b.chapter);
      if (ca !== cb) return ca - cb;
      const df = b.freq - a.freq;
      if (df) return df;
      return a.word.localeCompare(b.word, 'en');
    });
  }

  function importJSONFile(file) {

        const words = Array.isArray(parsed) ? parsed : parsed.words;
        if (!Array.isArray(words) || !words.length) throw new Error('文件中没有 words 数组');
        ui.pendingImport = parsed;

      } catch (e) { toast(`JSON 解析失败：${e.message}`, 'error'); }

  function parseBulkText(text, defaultChapter) {
    const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
    const parsed = [], errors = [];
    const existing = new Set(state.words.map(w => w.word.toLowerCase()));
    let firstData = true;
    lines.forEach((line, idx) => {
      const raw = line.trim();
      if (!raw) return;
      let cols;
      if (raw.includes('\t')) cols = raw.split('\t');
      else if (raw.includes('|')) cols = raw.split('|');
      else cols = raw.split(',');
      cols = cols.map(s => s.trim());
      if (!cols[0]) return;
      if (firstData) {
        firstData = false;
        if (/^(word|单词|英文)$/i.test(cols[0])) return;
      }
      if (cols.length < 2) { errors.push(`第 ${idx + 1} 行：列数不足，已跳过。`); return; }
      const wordText = cols[0];
      let pos = '', chinese = '', synonym = '', antonym = '', freq = 1, chapter = defaultChapter;
      if (cols.length >= 6) {
        pos = cols[1]; chinese = cols[2]; synonym = cols[3]; antonym = cols[4];
        freq = parseInt(cols[5], 10); if (!Number.isFinite(freq)) freq = 1;
        if (cols[6]) chapter = normalizeChapterInput(cols[6]) || defaultChapter;
      } else if (cols.length === 5) {
        pos = cols[1]; chinese = cols[2]; synonym = cols[3]; antonym = cols[4];
      } else if (cols.length === 4) {
        pos = cols[1]; chinese = cols[2]; freq = parseInt(cols[3], 10);
        if (!Number.isFinite(freq)) freq = 1;
      } else if (cols.length === 3) {
        pos = cols[1]; chinese = cols[2];
      } else {
        chinese = cols[1];
      }
      if (!chinese) { errors.push(`第 ${idx + 1} 行：缺少中文释义，已跳过。`); return; }
      const key = wordText.toLowerCase();
      if (existing.has(key)) { errors.push(`第 ${idx + 1} 行：${wordText} 已存在，已跳过。`); return; }
      existing.add(key);
      parsed.push(normalizeWord({ id: uid('IMP'), word: wordText, pos, chinese, synonym, antonym, freq, chapter, reviewInfo: defaultReview(), isWeakCard: false, isArchived: false }));
    });
    return { parsed, errors };
  }
  function confirmBulk() {
    if (!ui.manage.bulkParsed.length) return;
    const count = ui.manage.bulkParsed.length;
    state.words.push(...ui.manage.bulkParsed);
    ui.manage.bulkParsed = []; ui.manage.bulkErrors = []; ui.manage.bulkRaw = ''; ui.manage.bulkOpen = false;
    resetSessions(); persist(); renderManage(); toast(`已导入 ${count} 个单词。`, 'success');
  }

  /* ============================================================
     统计
     ============================================================ */
  function chapterStats() {
    return CHAPTERS.map(c => {
      const list = state.words.filter(w => w.chapter === c.id);
      let mastered = 0, weak = 0;
      list.forEach(w => {
        if (w.isArchived) mastered++;
        else if (w.isWeakCard) weak++;
        else if (w.reviewInfo.continuousCorrect >= 2 || w.reviewInfo.lastSelfRate === 3) mastered++;
      });
      return { ...c, total: list.length, mastered, weak, rest: Math.max(0, list.length - mastered - weak) };
    });
  }
  function calendarHTML() {
    const [y, m] = ui.stats.month.split('-').map(Number);

  function autoStartTimer() {

  }
  function accountTimerPartial() {
    const extra = Math.max(0, timer.elapsed - timer.accounted);
    if (extra > 0) {
      const d = state.stats.daily[todayKey()] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0,0,0,0] };
      d.seconds = (Number(d.seconds) || 0) + extra;
      state.stats.daily[todayKey()] = d;
      timer.accounted = timer.elapsed;
      saveSoon();
    }
  }
  function tick() {
    if (timer.running) {
      timer.elapsed += 1;

        const add = timer.elapsed - timer.accounted;
        const d = state.stats.daily[todayKey()] || { reviewed: 0, newLearned: 0, weakAdded: 0, seconds: 0, ratings: [0,0,0,0] };
        d.seconds = (Number(d.seconds) || 0) + add;

        timer.accounted = timer.elapsed;

  /* ============================================================
     操作
     ============================================================ */
  function rateCurrent(rating) {
    const mode = ui.mode;
    const s = ui[mode];
    if (!s.revealed) { toast('请先显示释义再自评。', 'warn'); return; }
    const w = currentWord(mode);
    if (!w) return;
    autoStartTimer();
    const result = scheduleWord(w, rating);
    recordReview(w, rating, result.wasNew);
    persist();
    const label = ['完全不会', '有点印象', '基本掌握', '熟练'][rating];
    toast(`已记录：${label}，${formatInterval(result.ms)}复习。${rating === 0 ? ' 已加入薄弱本。' : ''}`, rating === 0 ? 'warn' : 'success');
    advance(mode);
  }
  function skipCurrent() {
    const mode = ui.mode, s = ui[mode];
    if (!currentWord(mode)) return;
    s.skipped += 1; s.idx += 1; s.revealed = false;
    if (s.idx >= s.queue.length) s.done = true;
    persist(); renderMode(mode); toast('已跳过，不计入复习。', '');
  }
  function toggleWeak(id) {
    const w = getWord(id); if (!w) return;
    w.isWeakCard = !w.isWeakCard; persist();
    toast(w.isWeakCard ? '已加入薄弱本。' : '已移出薄弱本。', w.isWeakCard ? 'warn' : 'success');
    if (ui.mode === 'weak') { initWeakQueue(true); renderWeak(); }
    else if (ui.mode === 'manage') renderManage();
    else renderMode(ui.mode);
  }
  function unweakCurrent(id) {
    const w = getWord(id); if (!w) return;
    w.isWeakCard = false; persist(); initWeakQueue(true); renderWeak(); toast('已标记掌握，移出薄弱本。', 'success');
  }

    const label = $('#fontValue'); if (label) label.textContent = `${v}%`;
  }

  /* ============================================================
     事件
     ============================================================ */
  function handleAction(action, el, event) {
    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'open-help': openHelp(); break;
      case 'open-timer': openTimer(); break;
      case 'open-speech': openSpeech(); break;
      case 'toggle-theme': {
        state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; applyTheme(state.settings.theme); persist();
        if (ui.mode === 'stats') renderStats();
        break;
      }
      case 'select-scope': selectScope(el.dataset.scope); break;
      case 'reveal': {
        const s = ui[ui.mode]; if (!s) break;
        autoStartTimer(); s.revealed = true; renderMode(ui.mode); break;
      }
      case 'skip': skipCurrent(); break;
      case 'rate': rateCurrent(parseInt(el.dataset.rating, 10) || 0); break;
      case 'toggle-weak': toggleWeak(el.dataset.id); break;
      case 'unweak': unweakCurrent(el.dataset.id); break;
      case 'speak': speakWord(el.dataset.word); break;
      case 'test-apply': {
        state.settings.testChapter = $('#testChapter').value;
        state.settings.testHighOnly = $('#testHighOnly').checked;
        persist(); initTestQueue(true); renderTest(); break;
      }
      case 'test-reset': {
        state.settings.testChapter = 'all'; state.settings.testHighOnly = false;
        persist(); initTestQueue(true); renderTest(); break;
      }
      case 'test-rebuild': initTestQueue(true); renderTest(); break;
      case 'chapter-reload': initChapterQueue(true); renderChapter(); toast('已重新加载本组新词与到期词。', 'success'); break;
      case 'weak-reload': initWeakQueue(true); renderWeak(); break;
      case 'go-test': setMode('test'); break;
      case 'go-weak': setMode('weak'); break;
      case 'go-chapter': setMode('chapter'); break;
      case 'page-prev': ui.manage.page = Math.max(1, ui.manage.page - 1); renderManage(); break;
      case 'page-next': ui.manage.page += 1; renderManage(); break;
      case 'add-word': editWordModal(null); break;
      case 'edit-word': { const w = getWord(el.dataset.id); if (w) editWordModal(w); break; }
      case 'save-word': saveWord(); break;
      case 'delete-word': deleteWord(el.dataset.id); break;
      case 'delete-confirm': doDelete(); break;
      case 'archive-word': archiveWord(el.dataset.id); break;
      case 'export-json': exportJSON(); break;
      case 'import-json': { const input = $('#jsonFileInput'); if (input) { input.value = ''; input.click(); } break; }
      case 'restore-json': restoreJSON(); break;
      case 'parse-bulk': {
        const text = $('#bulkText') ? $('#bulkText').value : '';
        const ch = $('#bulkChapter') ? $('#bulkChapter').value : CHAPTERS[0].id;
        const r = parseBulkText(text, ch);
        ui.manage.bulkRaw = text; ui.manage.bulkParsed = r.parsed; ui.manage.bulkErrors = r.errors; ui.manage.bulkOpen = true;
        renderManage();
        if (!r.parsed.length) toast('没有解析到可导入单词，请检查格式。', 'error');
        else toast(`解析成功 ${r.parsed.length} 个，请确认预览。`, 'success');
        break;
      }
      case 'confirm-bulk': confirmBulk(); break;
      case 'clear-bulk': ui.manage.bulkRaw = ''; ui.manage.bulkParsed = []; ui.manage.bulkErrors = []; ui.manage.bulkOpen = true; renderManage(); break;
      case 'reset-progress': dangerConfirm('重置全部复习进度', '将清空所有单词的自评、复习间隔、连续掌握、薄弱与归档状态，并清空统计；词库保留。', '重置进度', 'reset-progress'); break;
      case 'clear-bank': dangerConfirm('清空全部词库', `将删除全部 ${state.words.length} 个单词及学习进度。`, '清空词库', 'clear-bank'); break;
      case 'restore-builtin': dangerConfirm('恢复内置 698 词', '将用内置词库覆盖当前全部单词，并清空进度。', '恢复内置词库', 'restore-builtin'); break;
      case 'danger-next': dangerNext(); break;
      case 'danger-final': {
        const p = ui.pendingDanger; ui.pendingDanger = null; closeModal();
        if (!p) break;
        if (p.action === 'reset-progress') resetProgress();
        else if (p.action === 'clear-bank') clearBank();
        else if (p.action === 'restore-builtin') restoreBuiltin();
        break;
      }
      case 'calendar-prev': {
        let [y, m] = ui.stats.month.split('-').map(Number); m -= 1; if (m < 1) { m = 12; y -= 1; }
        ui.stats.month = `${y}-${pad2(m)}`; renderStats(); break;
      }
      case 'calendar-next': {
        let [y, m] = ui.stats.month.split('-').map(Number); m += 1; if (m > 12) { m = 1; y += 1; }
        ui.stats.month = `${y}-${pad2(m)}`; renderStats(); break;
      }
      case 'timer-start': if (!timer.running) { timer.running = true; updateTimerUI(); } break;
      case 'timer-pause': timer.running = false; accountTimerPartial(); updateTimerUI(); break;
      case 'timer-reset': accountTimerPartial(); timer.running = false; timer.elapsed = 0; timer.accounted = 0; updateTimerUI(); break;
      case 'test-speech': speakWord('opportunity'); break;
      default: break;
    }
  }
  function bindEvents() {
    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-mode]');
      if (nav && nav.classList.contains('nav-btn')) { event.preventDefault(); setMode(nav.dataset.mode); return; }
      const actionEl = event.target.closest('[data-action]');
      if (actionEl) {
        if (actionEl.tagName === 'INPUT' && actionEl.type === 'checkbox') return;
        event.preventDefault();
        handleAction(actionEl.dataset.action, actionEl, event);
        return;
      }
      const card = event.target.closest('.word-card[data-card-tap]');
      if (card) {
        if (event.target.closest('button, a, input, textarea, select, label')) return;
        const s = ui[ui.mode];
        if (s && !s.revealed) { autoStartTimer(); s.revealed = true; renderMode(ui.mode); }
      }
    });
    document.addEventListener('change', event => {
      const t = event.target;
      if (t.id === 'manageChapter' || t.id === 'manageStatus' || t.id === 'manageHighOnly') {
        state.settings.manageFilters = {
          q: state.settings.manageFilters.q,
          chapter: $('#manageChapter') ? $('#manageChapter').value : state.settings.manageFilters.chapter,
          status: $('#manageStatus') ? $('#manageStatus').value : state.settings.manageFilters.status,
          highOnly: $('#manageHighOnly') ? $('#manageHighOnly').checked : state.settings.manageFilters.highOnly
        };
        ui.manage.page = 1; persist(); renderManage();
      } else if (t.id === 'voiceSelect') {
        state.settings.voiceURI = t.value; persist();
      } else if (t.id === 'jsonFileInput') {
        const file = t.files && t.files[0]; importJSONFile(file); t.value = '';
      }
    });
    document.addEventListener('input', event => {
      const t = event.target;
      if (t.id === 'manageSearch') {
        state.settings.manageFilters.q = t.value; ui.manage.page = 1;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { ui.manage.searchFocus = true; saveSoon(); renderManage(); }, 220);
      } else if (t.id === 'bulkText') {
        ui.manage.bulkRaw = t.value;
      } else if (t.id === 'fontScale') {
        state.settings.fontScale = clamp(parseInt(t.value, 10) || 100, 100, 150);
        applyFontScale(state.settings.fontScale); saveSoon();
      } else if (t.id === 'speechRate') {
        state.settings.speechRate = clamp(parseFloat(t.value) || 0.85, 0.5, 1.3);
        const label = $('#speechRateValue'); if (label) label.textContent = state.settings.speechRate.toFixed(2);
        saveSoon();
      }
    });
    document.addEventListener('toggle', event => {
      if (event.target && event.target.id === 'bulkDetails') ui.manage.bulkOpen = !!event.target.open;
    }, true);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { const root = $('#modalRoot'); if (root && !root.hidden) { closeModal(); return; } }
      const tag = (event.target && event.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
      const root = $('#modalRoot'); if (root && !root.hidden) return;
      const s = ui[ui.mode]; if (!s || !currentWord(ui.mode)) return;
      if (event.code === 'Space' && !s.revealed && ui.mode !== 'test') { event.preventDefault(); autoStartTimer(); s.revealed = true; renderMode(ui.mode); }
      else if (event.key.toLowerCase() === 's') { event.preventDefault(); const w = currentWord(ui.mode); if (w) speakWord(w.word); }
      else if (s.revealed && ['1','2','3','4'].includes(event.key)) { event.preventDefault(); rateCurrent(parseInt(event.key, 10) - 1); }
    });
    window.addEventListener('beforeunload', () => { accountTimerPartial(); persist(); });
  }

  /* ============================================================
     高危操作
     ============================================================ */
  function resetProgress() {
    state.words.forEach(w => { w.reviewInfo = defaultReview(); w.isWeakCard = false; w.isArchived = false; });
    state.stats.daily = {};
    resetSessions(); persist(); renderMode(ui.mode);
    toast('已重置全部复习进度，词库保留。', 'warn');
  }
  function clearBank() {
    state.words = []; state.stats.daily = {}; resetSessions(); persist(); setMode('manage', false); renderManage();
    toast('词库已清空，可通过 JSON 导入恢复。', 'error');
  }
  function restoreBuiltin() {
    state.words = normalizeWords(clone(BUILTIN)); state.stats.daily = {}; resetSessions(); persist(); setMode('chapter', false);
    toast('已恢复内置 698 词，学习进度清零。', 'success');
  }

  /* ============================================================
     初始化
     ============================================================ */
  function init() {
    loadData();
    applyTheme(state.settings.theme);
    applyFontScale(state.settings.fontScale);
    bindEvents();
    setMode(state.settings.lastMode, false);
    setInterval(tick, 1000);
    updateTimerUI();
    if (!state.words.length) setTimeout(() => toast('词库为空，可到“词库管理 → 恢复内置 698 词”。', 'warn'), 700);
    if (!speechSupported) setTimeout(() => toast('当前浏览器不支持 Web Speech 朗读。', 'warn'), 1200);
    window.__T698_READY__ = true;
  }
  window.__T698_LIB_UPGRADE__ = function () {
    if (window.__T698_READY__ && ui.mode === 'stats') renderStats();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
  </script>
</body>
</html>
